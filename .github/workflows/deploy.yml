name: Deploy to production
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: build
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.PROD_SERVER }}
          username: ${{ secrets.PROD_SERVER_USERNAME}}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            cd ~/stagetool-api
            git reset --hard HEAD
            git pull
            cd src
            kill $(ps aux | grep gunic* | awk '{print $2}')
            nohup gunicorn -w 4 -b :6700 -t 300 --log-level debug main:app &
